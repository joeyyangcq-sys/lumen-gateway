_meta:
  format: lumen.apisix.bundle/v1
  managed_kinds:
    - routes
    - services
    - upstreams

routes:
  demo-route:
    id: demo-route
    uri: /demo-v2
    service_id: demo-service

services:
  demo-service:
    id: demo-service
    upstream_id: demo-upstream

upstreams:
  demo-upstream:
    id: demo-upstream
    scheme: http
    pass_host: rewrite
    upstream_host: demo-v2.internal
    nodes:
      "127.0.0.1:9082": 1
